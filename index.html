<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aster · 一处数字个体的栖息之所</title>
<meta name="description" content="Aster：能记住、会长大、数据归你的对话个体。Mac、Windows、手机网页版，记忆可导出可迁移。">
<meta name="theme-color" content="#f6f5f3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.6 13.8 10 21 12l-7.2 2L12 21.4 10.2 14 3 12l7.2-2Z' fill='none' stroke='%23e8173d' stroke-width='1.6'/></svg>">
<style>
  :root{--pink:#e8173d;--ink:#1b1b1e;--muted:#7a7a80;--line:rgba(20,20,25,.08);--bg:#f6f5f3}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,'PingFang SC','Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  header{position:sticky;top:0;z-index:10;background:rgba(246,245,243,.86);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:12px;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.26em;font-size:14px}
  .logo svg{width:22px;height:22px;stroke:var(--pink)}
  .nav .sp{flex:1}
  .nav a.lnk{font-size:13px;color:var(--muted);margin-left:22px}
  .nav a.lnk:hover{color:var(--ink)}
  .lang{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;cursor:pointer;background:#fff}

  .hero{padding-block:96px 72px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
  #top h1{margin:0 0 18px;font-size:44px;line-height:1.28;letter-spacing:-.01em;font-weight:600}
  #top h1 em{font-style:normal;color:var(--pink)}
  .hero p.lede{margin:0 0 28px;font-size:15.5px;line-height:2;color:#4a4a50;max-width:34em}
  .cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:12px;
    background:var(--pink);color:#fff;font-size:14px;box-shadow:0 10px 24px rgba(232,23,61,.22)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid rgba(20,20,25,.12);box-shadow:none}
  .note{margin-top:16px;font-size:12px;color:var(--muted)}
  .art{display:grid;place-items:center}
  #heroHelix{width:440px;height:440px;max-width:100%;display:block;
    filter:drop-shadow(0 20px 60px rgba(232,23,61,.14))}

  section{padding:64px 0;border-top:1px solid var(--line)}
  h2{margin:0 0 10px;font-size:13px;letter-spacing:.22em;color:var(--pink);font-weight:600}
  h3{margin:0 0 22px;font-size:26px;font-weight:600;letter-spacing:-.01em}
  .lead{font-size:14.5px;line-height:2;color:#4a4a50;max-width:46em}

  .manifesto{background:transparent;border:0;border-radius:0;padding:0;
    box-shadow:0 12px 34px rgba(20,20,25,.05);max-width:760px}
  .manifesto p{margin:0 0 14px;font-size:14.5px;line-height:2;color:#33333a}
  .manifesto p.key{color:var(--ink);font-weight:500}
  .manifesto .sig{color:var(--muted);font-size:12.5px;margin:18px 0 0}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;
    box-shadow:0 6px 18px rgba(20,20,25,.04);display:flex;flex-direction:column;min-height:220px}
  .card b{font-size:16px;font-weight:600}
  .card .tag{margin-top:6px;font-size:11.5px;color:var(--pink);letter-spacing:.06em}
  .card p{margin:12px 0 18px;font-size:13.5px;line-height:1.95;color:#5a5a60;flex:1}
  .card .dl{font-size:13px;color:var(--pink)}
  .card .dl span{color:var(--muted);font-size:12px}

  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
  .step{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
  .step .n{width:26px;height:26px;border-radius:9px;background:var(--pink);color:#fff;
    display:grid;place-items:center;font-size:12.5px;margin-bottom:12px}
  .step b{display:block;margin-bottom:8px;font-size:14.5px}
  .step p{margin:0;font-size:13px;line-height:1.9;color:#5a5a60}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
  ul.plain{margin:0;padding-left:18px;font-size:13.5px;line-height:2.1;color:#4a4a50}
  ul.plain li::marker{color:var(--pink)}

  details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px}
  details summary{cursor:pointer;font-size:14px;font-weight:500}
  details p{margin:10px 0 0;font-size:13.5px;line-height:1.95;color:#5a5a60}

  footer{border-top:1px solid var(--line);padding:32px 0 48px;font-size:12.5px;color:var(--muted)}
  footer .row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  footer a:hover{color:var(--ink)}


  @media (max-width:900px){
    .hero{grid-template-columns:1fr;padding-block:56px 40px}
    #top h1{font-size:32px}
    .orb{width:180px;height:180px;border-radius:26px}
    .grid,.how,.two{grid-template-columns:1fr}
    h3{font-size:21px}
  }


  /* 截图轮播 */
  .shots{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding:6px 2px 14px;scrollbar-width:none}
  .shots::-webkit-scrollbar{display:none}
  .shot{flex:0 0 auto;width:258px;margin:0;scroll-snap-align:center;
    background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 8px 10px;
    box-shadow:0 10px 28px rgba(20,20,25,.06);transition:transform .25s ease}
  .shot:hover{transform:translateY(-3px)}
  .shot img{width:100%;display:block;border-radius:14px}
  .shot.wide{width:520px;padding:10px 10px 10px}
  .shot.wide img{border-radius:12px}
  .shot figcaption{margin-top:8px;text-align:center;font-size:12px;color:var(--muted)}
  .shotBlock{margin-bottom:26px}
  .shotLabel{margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .shotLabel b{font-size:14px;color:var(--pink);font-weight:600}
  .shotLabel span{font-size:12.5px;color:var(--muted)}
  .shotNav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
  #shots .shotNav button{display:grid;place-items:center;width:auto;height:auto;border-radius:0;
    border:0!important;background:transparent!important;box-shadow:none!important;
    color:rgba(245,244,242,.55);line-height:1;padding:2px 6px;
    background:#fff;color:#c8143a;font-size:16px;line-height:1;cursor:pointer}
  .shotNav button:disabled{opacity:.28;cursor:default}
  .shotNav button:hover{color:#fff}
  .shotNav .dots{display:flex;gap:8px;align-items:center}
  .dots{display:flex;gap:6px}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(232,23,61,.25);display:block}
  .dots i.on{background:var(--pink);width:16px;border-radius:3px}
  @media (max-width:640px){
    .shot{width:68vw}
    .shot.wide{width:86vw}
    .shots{gap:12px;margin:0 -18px;padding:6px 18px 14px}
  }

  /* ===== 手机 ===== */
  @media (max-width:640px){
    .wrap{padding:0 18px}
    .nav{height:56px;gap:8px}
    .nav a.lnk{display:none}
    .hero{padding-block:28px 8px;gap:18px}
    #top h1{font-size:30px;line-height:1.32;margin-bottom:14px}
    .hero p.lede{font-size:14.5px;line-height:1.9;margin-bottom:20px}
    .cta{gap:10px}
    .btn{padding:11px 18px;font-size:13.5px}
    .note{margin-top:12px;font-size:11.5px}
    #heroHelix{width:230px;height:230px;margin:0 auto}
    .art{order:-1}
    section{padding:40px 0}
    h3{font-size:20px;margin-bottom:16px}
    .lead{font-size:14px;line-height:1.9}
    .manifesto{padding:22px 18px 18px;border-radius:16px}
    .manifesto p{font-size:13.5px;line-height:1.95}
    .grid,.how,.two{gap:12px}
    .card{padding:18px;min-height:0}
    .card p{font-size:13px;margin:10px 0 14px}
    .step{padding:18px}
    details{padding:14px 15px}
    details summary{font-size:13.5px}
    footer{padding:24px 0 36px}
    footer .row{gap:12px;font-size:12px}
    .chips-line{flex-wrap:wrap}
  }
  @media (max-width:380px){
    #top h1{font-size:26px}
    #heroHelix{width:200px;height:200px}
  }

  /* —— 视觉精修 2026-11-11 —— */
  :root{
    --ink:#141416; --ink-2:#4a4a50; --ink-3:#8c8c92;
    --paper:#f6f5f3; --line:rgba(20,20,25,.08);
    --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif;
  }
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    font-family:-apple-system,'PingFang SC','Helvetica Neue',Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(232,23,61,.05), transparent 60%),
      var(--paper);
  }
  h1{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;line-height:1.12;
     font-size:clamp(38px,5.2vw,68px)}
  h1 em{font-style:normal;color:var(--pink)}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(24px,3vw,36px);
     letter-spacing:.01em;line-height:1.25}
  p,li{font-size:16.5px;line-height:1.85;color:var(--ink-2)}
  .eyebrow, section > .wrap > h2 + p{letter-spacing:.02em}
  section{padding:96px 0;border-top:1px solid var(--line)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px}
  .card{border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,20,25,.03),0 12px 32px rgba(20,20,25,.05)}
  .shot{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;
        box-shadow:0 2px 6px rgba(20,20,25,.05),0 24px 48px rgba(20,20,25,.08)}
  .shot img{display:block;width:100%}
  .shot figcaption{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  @media (max-width:640px){ section{padding:64px 0} p,li{font-size:15.5px} }

  /* —— 版式二改 2026-11-11 下午 —— */
  /* 首屏做满一屏 */
  #top{ display:block; }
  #top > .heroInner{ min-height:calc(100vh - 68px); }
  #top > .heroInner{
    display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;
    max-width:1120px;margin:0 auto;padding:90px 28px 70px;width:100%}
  #top h1{font-size:clamp(44px,6vw,84px);line-height:1.06;letter-spacing:-.03em}
  #top .lede{max-width:52ch;margin-top:26px;font-size:17px;line-height:1.9;color:var(--ink-2)}
  #top .cta{margin-top:38px;display:flex;gap:12px}
  #top .note{margin-top:22px;font-size:12.5px;letter-spacing:.06em;color:var(--ink-3)}
  #top .art{display:flex;justify-content:center;align-items:center}
  #top .art canvas{width:min(46vw,520px);height:auto;opacity:.95}

  /* 章节：小号英文标签 + 衬线大字 + 细线 */
  section{border-top:1px solid var(--line)}
  section > .wrap > h2{
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    font-family:-apple-system,'PingFang SC',sans-serif;font-weight:500;color:var(--ink-3);
    margin-bottom:18px;
  }
  section > .wrap > h3{
    font-family:var(--serif);font-weight:600;letter-spacing:-.01em;
    font-size:clamp(26px,3.4vw,44px);line-height:1.28;max-width:30ch;
    margin-bottom:34px;color:var(--ink);
    text-wrap:balance;          /* 只在语义处断行（CJK 本身可断，别用 keep-all） */
  }

  /* 截图：给一个设备感的框 */
  .shot{border-radius:26px}

  @media (max-width:860px){
    #top > .heroInner{
      grid-template-columns:1fr;gap:18px;min-height:auto!important;
      padding:34px 20px 44px!important;
    }
    #top .art{order:-1;margin-bottom:0}
    #top .art canvas{width:min(58vw,240px)}
    #top h1{font-size:clamp(28px,7.6vw,40px);line-height:1.14;letter-spacing:-.03em}
    #top h1 em{display:inline}
    #top .lede{margin-top:14px;font-size:14.5px;line-height:1.8;max-width:100%;overflow-wrap:anywhere}
    #top > .heroInner{max-width:100%;overflow:hidden}
    #top > .heroInner > *{min-width:0}
    #top h1,#top .lede{white-space:normal;word-break:break-word}
    #top h1{overflow-wrap:anywhere}
    #top .cta{margin-top:20px}
    #top .note{margin-top:12px;font-size:11.5px}
    section{padding:56px 0}
  }

  /* —— 版式三改 —— */
  #idea .manifesto, #idea .card{
    background:transparent;border:0;box-shadow:none;padding:0;max-width:62ch;
  }
  #idea .manifesto p{font-size:15px;margin:0 0 18px}
  #idea .manifesto .key{font-family:var(--serif);font-size:19px;color:var(--ink)}
  #idea .manifesto .sig{margin-top:26px;font-family:var(--serif);color:var(--pink);font-size:17px}
  #clients .card{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,20,25,.03)}
  #clients .card b{font-family:var(--serif);font-size:19px}
  h3{max-width:26ch}

  /* —— 几何层 —— */
  body{position:relative}
  body::before{               /* 极细网格，整页垫底 */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(to right, rgba(20,20,25,.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(20,20,25,.035) 1px, transparent 1px);
    background-size:72px 72px;
    mask-image:radial-gradient(1200px 800px at 50% 0%, #000 30%, transparent 78%);
  }
  #top{position:relative;z-index:1}
  #top::before{               /* 首屏同心圆 */
    content:"";position:absolute;right:-8vw;top:50%;transform:translateY(-50%);
    width:min(70vw,760px);aspect-ratio:1;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, transparent 0 38%, rgba(232,23,61,.07) 38% 38.4%, transparent 38.4%),
               radial-gradient(circle, transparent 0 55%, rgba(20,20,25,.06) 55% 55.3%, transparent 55.3%),
               radial-gradient(circle, transparent 0 72%, rgba(20,20,25,.05) 72% 72.3%, transparent 72.3%);
  }
  #top::after{                /* 一点斜切色块 */
    content:"";position:absolute;right:6vw;bottom:-6vh;width:34vw;height:34vw;max-width:420px;max-height:420px;
    background:linear-gradient(135deg, rgba(232,23,61,.06), rgba(232,23,61,0));
    transform:rotate(-12deg);border-radius:48px;pointer-events:none;
  }
  section{position:relative;z-index:1}
  section::before{display:none}   /* 旧的那根线不要了，改成跟标题绑在一起 */
  section > .wrap > h2{
    display:flex;align-items:center;gap:10px;
  }
  section > .wrap > h2::before{
    content:"";width:1px;height:13px;background:rgba(20,20,25,.28);flex:0 0 auto;
  }
  /* 标题字体：中英都加一层反差 */
  h1,h2,h3{font-feature-settings:"palt" 1}
  #top h1{font-weight:650}
  section > .wrap > h3{font-weight:650}

  /* —— 几何层 v2：色块 + 大字 —— */
  #top h1{
    font-family:'Inter','Helvetica Neue','PingFang SC',sans-serif;
    font-weight:700;letter-spacing:-.045em;line-height:1.02;
    font-size:clamp(38px,5.6vw,80px);
    text-wrap:balance;
  }
  #top h1 em{color:var(--pink)}
  #top > .heroInner{position:relative}
  /* 星轨背后一个大色圆 */
  #top .art{position:relative}
  #top .art::before{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(50vw,540px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle, rgba(232,23,61,.10) 0%, rgba(232,23,61,0) 68%);
    z-index:0;
  }
  #top .art::after{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(52vw,580px);aspect-ratio:1;border-radius:50%;
    border:1px solid rgba(20,20,25,.10);z-index:0;
  }
  #top .art canvas{display:none}
  #top .artStar{display:none}
  #top .art canvas{display:block;position:relative;z-index:1}
  /* 深色章节 */
  #idea{
    background:
      radial-gradient(900px 520px at 82% 12%, rgba(232,23,61,.22), transparent 62%),
      radial-gradient(700px 420px at 12% 88%, rgba(90,40,60,.35), transparent 60%),
      linear-gradient(158deg, #17171b 0%, #0c0c0f 52%, #150d11 100%);
    color:#f4f3f1;border-top-color:transparent;
  }
  #idea h2{color:rgba(255,255,255,.45)}
  section > .wrap > h2::before{background:rgba(255,255,255,.30)!important}
  #idea .manifesto{background:transparent!important;border:0!important;box-shadow:none!important}
  #idea h3{color:#fff}
  #idea p, #idea .manifesto p{font-size:15px;color:rgba(255,255,255,.72)}
  #idea .manifesto .key{color:#fff}
  #idea .manifesto .sig{color:#ff5f7d}
  #idea::before{background:rgba(255,255,255,.28)}

  /* === 全站深色（2026-11-11 下午，他定的方向）=== */
  :root{
    --paper:#0d0d10;
    --ink:#f5f4f2;
    --ink-2:rgba(245,244,242,.74);
    --ink-3:rgba(245,244,242,.42);
    --line:rgba(255,255,255,.10);
  }
  html{background:#0b0b0d}
  body{
    color:var(--ink);
    background:
      radial-gradient(1000px 620px at 84% 4%, rgba(232,23,61,.20), transparent 60%),
      radial-gradient(800px 520px at 6% 42%, rgba(80,36,56,.30), transparent 62%),
      radial-gradient(900px 600px at 50% 108%, rgba(232,23,61,.10), transparent 60%),
      linear-gradient(160deg, #131316 0%, #0a0a0c 55%, #120c0f 100%);
    background-attachment:fixed;
  }
  body::before{                       /* 网格线换成浅色 */
    background-image:
      linear-gradient(to right, rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.045) 1px, transparent 1px);
  }
  header{background:rgba(10,10,12,.55);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav .lnk{color:rgba(245,244,242,.66)}
  .nav .lnk:hover{color:#fff}
  .lang{background:transparent;border:1px solid rgba(255,255,255,.22);
    color:rgba(245,244,242,.86);padding:5px 11px;border-radius:999px;font-size:12px}
  #top h1{color:#fff}
  #top .lede{color:rgba(245,244,242,.72)}
  #top .note{color:rgba(245,244,242,.42)}
  #top .art::before{background:radial-gradient(circle, rgba(232,23,61,.28) 0%, rgba(232,23,61,0) 66%)}
  #top .art::after{border-color:rgba(255,255,255,.13)}
  section{border-top:1px solid var(--line)}
  section::before{background:rgba(255,255,255,.22)}
  h2,h3{color:#fff}
  p,li{color:rgba(245,244,242,.72)}
  .btn{background:var(--pink);color:#fff;border-color:transparent}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.22)}
  .card,.shot{background:rgba(255,255,255,.045);border:1px solid var(--line);
    box-shadow:0 18px 48px rgba(0,0,0,.45)}
  #clients .card{background:rgba(255,255,255,.045);border-color:var(--line);box-shadow:0 18px 48px rgba(0,0,0,.45)}
  #clients .card b,#clients .card p{color:#fff}
  #clients .card p{color:rgba(245,244,242,.7)}
  .card b{color:#fff}

  .shot figcaption{color:rgba(245,244,242,.42)}
  .shot img{background:#fff}
  .dl{color:#ff5f7d}
  #idea{background:transparent}
  footer{border-top:1px solid var(--line);color:rgba(245,244,242,.42)}
  a{color:inherit}
  ::selection{background:rgba(232,23,61,.35)}

  /* —— 深色统一收口：所有浅色容器改深 —— */
  .manifesto,.card,.step,details{
    background:rgba(255,255,255,.045)!important;
    border:1px solid rgba(255,255,255,.10)!important;
    box-shadow:none!important;
    color:#f5f4f2;
  }
  details summary,.card b,.step b,.manifesto .key{color:#fff}

    '下载':'下载','查看理念':'查看理念','下载 .pkg <span>（Apple 芯片）</span>':'下载 .pkg <span>（Apple 芯片）</span>',
  };

    document.querySelectorAll('a[href*="github.com/USER"]').forEach(a => a.href = rel);
  }
  const langBtn = document.getElementById('lang');
  const setLang = (l) => {
    document.documentElement.lang = l;
    document.querySelectorAll('[data-zh]').forEach(el => {
      const v = el.getAttribute('data-' + l);
      if (v) el.innerHTML = v;
    });
    langBtn.textContent = l === 'zh' ? 'EN' : '中文';
    localStorage.setItem('aster.site.lang', l);
    swapShots(l);
  };
  langBtn.onclick = () => setLang(document.documentElement.lang === 'zh' ? 'en' : 'zh');
  setLang(localStorage.getItem('aster.site.lang') || 'zh');
</script>
<script>
  document.querySelectorAll('[data-carousel]').forEach((row) => {
    const block = row.closest('.shotBlock');
    const dots = block.querySelector('.dots');
    const prev = block.querySelector('.prev');
    const next = block.querySelector('.next');
    const shots = [...row.querySelectorAll('.shot')];

    shots.forEach((_, i) => {
      const d = document.createElement('i');
      d.onclick = () => shots[i].scrollIntoView({behavior: 'smooth', inline: 'center', block: 'nearest'});
      dots.appendChild(d);
    });
    const marks = [...dots.children];
    let cur = 0;

    const sync = () => {
      const mid = row.scrollLeft + row.clientWidth / 2;
      let best = 0, bestD = 1e9;
      shots.forEach((el, i) => {
        const c = el.offsetLeft + el.offsetWidth / 2;
        const d = Math.abs(c - mid);
        if (d < bestD) { bestD = d; best = i; }
      });
      cur = best;
      marks.forEach((m, i) => m.classList.toggle('on', i === best));
      prev.disabled = best === 0;
      next.disabled = best === shots.length - 1;
    };

    row.addEventListener('scroll', sync, {passive: true});
    const step = (dir) => {
      const nx = Math.max(0, Math.min(shots.length - 1, cur + dir));
      shots[nx].scrollIntoView({behavior: 'smooth', inline: 'center', block: 'nearest'});
    };
    prev.onclick = () => step(-1);
    next.onclick = () => step(1);
    sync();
  });
</script>
